<header id="header">
    <nav class="container">
        <div>
            <a href=""><img src="../../assets/image/logo.png" alt=""></a>
        </div>

        <div class="navBar">
            <span (click)="openSideDrawer('offcanvas')" class="bi bi-list toogle"></span>
            <ul class="navIteam">
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'home'}" (click)="navigateTo('home')">Home</li>
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'login'}" (click)="navigateTo('login')">Log in</li>
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'portfolio'}" (click)="navigateTo('portfolio')">Portfolio</li>
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'register'}" (click)="navigateTo('register')">Register</li>
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'practice'}" (click)="navigateTo('practice')">Practice</li>
            </ul>
        </div>
    </nav>
 

    <div class="offcanvas offcanvas-start " tabindex="-1" id="offcanvas" aria-labelledby="offcanvasLabel">
        <div class="offcanvas-header">
            <div><img src="../../assets/image/logo.png" alt=""></div>
            <div>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
        </div>
        <div class="offcanvas-body">
            <ul class="MobilenavIteam">
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'home'}" (click)="navigateTo('home')">Home</li>
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'login'}" (click)="navigateTo('login')">Log in</li>
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'portfolio'}" (click)="navigateTo('portfolio')">Portfolio</li>
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'register'}" (click)="navigateTo('register')">Register</li>
                <li class="navLink" [ngClass]="{'activeLink': selectedLink === 'practice'}" (click)="navigateTo('practice')">Practice</li>
            </ul>
        </div>
    </div>
</header>

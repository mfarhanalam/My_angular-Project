<!-- ================tab==========  -->

<div class="container">
    <div style="margin: 20px; display: flex; justify-content: center;">
        <button class="signBtn" (click)="showContent('Sign')" [class.active]="activeTab === 'Sign'">Sign
            up</button>
        <button class="logBtn" (click)="showContent('Log')" [class.secondactive]="activeTab === 'Log'">Log
            in</button>
    </div>
</div>

<div *ngIf="activeTab === 'Sign'" style=" display: flex; justify-content: center;">
    <div>
        <h1>Register Page</h1>
        <form action="">
            <div class="form">
                <input autocomplete="off" placeholder="Full Name" type="name" formControlName="Name" required>
            </div>
            <div class="form">
                <input autocomplete="off" placeholder="Email" type="email" formControlName="email" required>
            </div>
            <div class="form">
                <input autocomplete="off" placeholder="Password" type="password" formControlName="Password" required>
            </div>
            <!-- City Selection Dropdown -->
            <div class="form">
                <select formControlName="city" required>
                    <option value="" disabled selected>Select City</option>
                    <option value="city1">Patna</option>
                    <option value="city2">Hajipur</option>
                    <option value="city3">Kanpur</option>
                    <!-- Add more city options as needed -->
                </select>
            </div>
            <!-- Radio Button -->
            <div class="form">
                <label>
                    <input type="radio" name="gender" value="male" required> Male
                </label>
                <label style="margin-left: 10px;">
                    <input type="radio" name="gender" value="female" required> Female
                </label> <br>
                <label>
                    <input type="radio" name="country" value="India" required> India
                </label>
                <label style="margin-left: 10px;">
                    <input type="radio" name="country" value="Other" required> Other
                </label>
            </div>

            <!-- Checkbox -->
            <div class="form">
                <label>
                    <input type="checkbox" name="subscribe" value="yes" required><span style="margin-left: 10px;">Fill
                        You all correct input</span>
                </label>
            </div>



            <div>
                <button class="rgstr-btn" type="submit">Register</button>
            </div>
        </form>
        <!-- Modal button -->
        <button type="button" (click)="openFormModal()">
            Form
        </button>
    </div>

</div>
<div *ngIf="activeTab === 'Log'">

  <div >
    <div class="login-box">
        <h2>login Form</h2>
        <form action="">
            <div class="user-box">
                <input type="text" required>
                <label for="">Username</label>
            </div>
            <div class="user-box">
                <input type="password" required>
                <label for="">Password</label>
            </div>
            <a>
                <span></span>
                <span></span>
                <span></span>
                <span></span>Submit
            </a>
        </form>
    </div>
</div>

    <div class="progress">
        <div class="progress-bar" [@progressAnimation]="progressWidth">


            {{ progressWidth }}%
        </div>
    </div>

</div>



<!-- Modal -->
<div class="modal fade" id="form_modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog ">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="exampleModalLabel">Modal title</h4>
                <button type="button" class="btn-close" (click)="closeFormModel()"></button>
            </div>
            <div class="modal-body">
                hjgngnn
            </div>
        </div>
    </div>
</div>

<section class="container">
  <div style="display: flex;justify-content: center;">
      <div *ngFor="let image of images; let i = index"
          [ngStyle]="{'width': (selectedImageIndex === i) ? '100%' : '10%', 'transition': '0.5s ease-in-out', 'margin': '10px'}"
          (click)="toggleImageSize(i)">
          <div
              style="background-image: url('{{image.img}}');height: 80vh;background-size: cover;cursor: pointer; position: relative;border-radius: 50px;">
              <div style="position: absolute;bottom: 0;left: 5%;color: #fff;font-weight: 500;">
                  <h3
                      [ngStyle]="{'transition': '0.6s ease-in-out', 'opacity': (selectedImageIndex === i) ? '1' : '0'}">
                      {{image.text}}</h3>
              </div>
          </div>
      </div>
  </div>
</section>

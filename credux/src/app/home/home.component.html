
<section class="main">
  <div class="containerr">
    <h4>EXPLORE CRED</h4>
    <div class="explore-cred">
      <div class="explore-item" *ngFor="let item of exploreItems" (click)="navigateTo(item.name)">
        <div class="icon">
          <i class="{{item.icon}}"></i>
        </div>
        <p>{{item.name}}</p>
      </div>
    </div>
  </div>
  <hr>
  <div class="your-money">
    <h4>Your Money</h4>
    <div class="balance mt-4">
      <div class="bank-Detail">
        <div style="display: grid; place-content: center;height: 25px;width: 25px;border: 1px solid #bdbdbd; border-radius: 25px;margin-right: 5px;">
          <img style="height: 18px;width: 18px; border-radius: 20px;" src="../../assets/image/bank.png" alt="banklogo">
        </div>
        <p>{{bankName}}</p>
      </div>
      <button class="check-balance" (click)="checkBalance()">Check Balance <i style="font-size: 10px;"
          class="bi bi-chevron-right"></i></button>
    </div>
  </div>

  <div class="needs-attention">
    <h4>Needs Attention</h4>
    <button class="view-all" (click)="viewAll()">View All</button>
  </div>





  <div class="actions">
    <div class="scan-pay">
      <div class="pay-icon">
        <i class="bi bi-qr-code-scan"></i>
      </div>
      <p (click)="scanAndPay()">Scan & Pay</p>
    </div>
    <div class="profile">
      <img src="path/to/profile.jpg" alt="Profile Picture">
      <p>{{userName}}</p>
    </div>
    <div class="pay-contacts">
      <div class="pay-icon">
        <i class="bi bi-person-rolodex"></i>
      </div>
      <p (click)="payContacts()">Pay Contacts</p>
    </div>
  </div>


</section>
